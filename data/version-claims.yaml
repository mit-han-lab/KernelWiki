## Version-claims registry — central side of the DEC-1 hybrid registry.
##
## Schema: data/schemas.yaml :: version-claims-registry.
##
## Each claim entry has:
##   id:                       (string, prefix vs-)
##   tool:                     (one of triton/cutlass/cuda/ptx/cute-dsl/cutile/tilelang/tilus/jax-pallas)
##   claim_valid_for:          (semver range, e.g. ">=3.6")
##   last_verified_release:    (must match a release name in data/tool-versions.yaml)
##   last_verified_at:         (ISO date)
##   applies_to:               (list of file paths or YAML JSON-pointers)
##   source_ids:               (list; each must resolve to a sources/**/*.md frontmatter id)
##   dev_branch_sha:           (required when claim_valid_for contains "dev")
##   notes:                    (optional)
##
## Wiki/reference pages and parsed YAML scalars in scope cite an entry by id
## via their `version_sensitive: <id>` pointer. The validator (task5) enforces
## that every per-page pointer resolves here AND every entry's `applies_to`
## paths exist + carry the matching pointer.

claims:
  - id: vs-triton-3.6-blackwell-tcgen05
    tool: triton
    claim_valid_for: ">=3.6"
    last_verified_release: "3.7.0"
    last_verified_at: 2026-08-16
    applies_to:
      - wiki/languages/triton-blackwell.md
      - references/primer.md
      - references/examples.md
      - data/inclusion-policy.yaml::triton.description
    source_ids:
      - doc-triton-3.7-blackwell
      - doc-triton-3.6-blackwell
      - pr-vllm-34597
      - pr-vllm-29339
      - pr-sglang-22079
      - pr-sglang-21019
      - pr-sglang-5390
      - pr-sglang-21595
    notes: |
      Tracks the claim that Triton 3.6+ has broad, hardened Blackwell (SM100)
      lowering paths through tcgen05.mma + TMEM (descriptor/TMA + warp_specialize on
      tl.dot, plus Gluon multi-CTA + 2CTA on tcgen05_mma_scaled), replacing
      the obsolete "no tcgen05 / no TMEM" framing. The underlying dialect
      operations already existed in the release/3.3.x source, so 3.6 is a
      maturity/coverage milestone rather than their point of introduction.
      Supporting evidence:
      data/triton-3.6-evidence.md memo plus the official release notes
      (doc-triton-3.6-blackwell). The post-refresh pr-vllm-34597 directly
      modifies inspectable @triton.jit MLA decode kernels, but its upstream PR
      explicitly targets SM120, so it is Blackwell-consumer evidence rather
      than an SM100 anchor. Supplementary
      post-refresh anchor: pr-vllm-29339 (Triton 3.6 triton_kernels library
      scoped to [sm100, sm90] for MXFP4 dispatch-gate, merged 2025-11-24).
      The direct SM100/GB200 downstream anchor is pr-sglang-22079; it is
      retained as historical/pre-refresh context (and
      appears in data/refresh-cutoff.yaml::previous_pages_manifest). It
      demonstrates a Gemma4 NVFP4 Triton attention path, merged 2026-04-10.
      pr-sglang-21019 is retained only as Hopper/H200 Triton context
      (memory-rearrangement kernel, merged 2026-03-23, no tl.dot); it is not
      an SM100 anchor. Other historical context includes pr-sglang-5390 and
      pr-sglang-21595.
      PyTorch PR 175826 was removed because it closed without merge
      and does not establish the claimed CUDA 13.0 CI migration. Triton 3.7.0,
      released 2026-05-07 at commit 5f3f125, is the latest stable release
      before the repository's 2026-05-20 cutoff and adds material 2CTA,
      multicast, verifier, and warp-specialization follow-on work. The
      strongest possible demonstrations of the 3.6 Blackwell-
      native paths (descriptor/TMA + warp_specialize, tl.dot_scaled, Gluon
      multi-CTA/2CTA) have NOT been found in any tracked-downstream merged
      PR locally; future refresh rounds should backfill such an anchor when
      one becomes available.
