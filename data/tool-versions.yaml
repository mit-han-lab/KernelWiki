## Tool releases of record for the version-sensitive registry.
## Read by scripts/check_version_freshness.py and the validator's
## DEC-4 CUTLASS pinning rule (task5). Schema: data/schemas.yaml
## :: tool-versions-snapshot.
##
## This file is deterministic and offline; entries are populated
## from upstream release notes captured via Codex consult, never
## from live network queries at validation time. Adding/updating
## entries requires a fresh Codex consult to confirm release name +
## date + channel.
##
## "needs-verification" sentinels mark fields the current refresh
## round did not authoritatively pin; future refresh rounds should
## replace them. The validator (task5) does not reject
## needs-verification entries, but check_version_freshness.py
## flags them as advisory warnings.
##
## Date convention: `released_at` is the GitHub release object's UTC
## `published_at` calendar date for GitHub-hosted tools. A changelog heading
## date is content metadata and is recorded separately in notes/source pages;
## it is not substituted for the release publication date.

tools:
  - tool: triton
    releases:
      - name: "3.7.0"
        released_at: "2026-05-07"
        channel: stable
        release_notes_url: "https://github.com/triton-lang/triton/releases/tag/v3.7.0"
        evidence_source_ids:
          - doc-triton-3.7-blackwell
        notes: |
          Latest stable Triton release before the 2026-05-20 refresh cutoff.
          Continues Blackwell support with end-to-end 2CTA work, TMA/tcgen05
          multicast, tcgen05 verifier and MMAv5 fixes, and warp-specialization
          hardening. Release commit 5f3f125.
      - name: "3.6.0"
        released_at: "2026-01-21"
        channel: stable
        release_notes_url: "https://github.com/triton-lang/triton/releases/tag/v3.6.0"
        evidence_source_ids:
          - doc-triton-3.6-blackwell
          - pr-sglang-22079
          - pr-sglang-21019
        notes: |
          Registry milestone that materially generalized and hardened Blackwell
          tcgen05 + TMEM lowering; source-defined operations existed by 3.3.
          Strongest user-visible Blackwell paths: descriptor/TMA
          warp-specialized matmul, Gluon multi-CTA / 2CTA, tl.dot_scaled / block
          scaled. See data/triton-3.6-evidence.md for the per-pathway breakdown.
      - name: "3.5.1"
        released_at: "2025-11-12"
        channel: stable
        release_notes_url: "https://github.com/triton-lang/triton/releases/tag/v3.5.1"
        notes: |
          Last 3.5.x patch before the 3.6 Blackwell story. Pages with
          version_sensitive claims valid for ">=3.5,<3.6" should pin to this
          release.

  - tool: cutlass
    releases:
      - name: "4.5.0"
        released_at: "2026-05-13"
        channel: stable
        release_notes_url: "https://github.com/NVIDIA/cutlass/releases/tag/v4.5.0"
        evidence_source_ids:
          - doc-cutlass-changelog-sm100
        notes: |
          Latest CUTLASS stable release before the 2026-05-20 cutoff. The
          date is the GitHub release object's publication date; the v4.5.0
          changelog heading is dated 2026-05-01. Wiki pages
          with confidence: verified that mention CUTLASS 4.x SHOULD pin to
          4.5.0 unless they specifically depend on a feature that arrived
          in a later patch.
      - name: "4.4.2"
        released_at: "2026-03-17"
        channel: stable
        release_notes_url: "https://github.com/NVIDIA/cutlass/releases/tag/v4.4.2"
        evidence_source_ids:
          - doc-cutlass-changelog-sm100
        notes: |
          Last 4.4.x patch before 4.5.0. GitHub published the release object
          on 2026-03-17; its changelog heading is dated 2026-03-13.
      - name: "4.4.0"
        released_at: "2026-02-26"
        channel: stable
        release_notes_url: "https://github.com/NVIDIA/cutlass/releases/tag/v4.4.0"
        evidence_source_ids:
          - doc-cutlass-changelog-sm100
        notes: |
          4.4.0 minor release. GitHub published the release object on
          2026-02-26; its changelog heading is dated 2026-02-14.
      - name: "4.3.0"
        released_at: "2025-11-24"
        channel: stable
        release_notes_url: "https://github.com/NVIDIA/cutlass/releases/tag/v4.3.0"
        evidence_source_ids:
          - doc-cutlass-changelog-sm100
        notes: |
          Pre-Blackwell-tutorial-rewrite era reference release. GitHub
          published the release object on 2025-11-24; its changelog heading is
          dated 2025-11-21.
      - name: "3.8.0"
        released_at: "2025-02-21"
        channel: stable
        release_notes_url: "https://github.com/NVIDIA/cutlass/releases/tag/v3.8.0"
        evidence_source_ids:
          - doc-cutlass-changelog-sm100
        notes: |
          First CUTLASS release with Blackwell support. Some legacy wiki
          pages reference "CUTLASS 3.x for SM100" (e.g. wiki/hardware/clc.md);
          those should be reconciled to a current 4.x stable release in task12.
          Date is the GitHub release object's publication date; the v3.8.0
          changelog heading is dated 2025-01-25.

  - tool: cuda
    releases:
      - name: "13.1"
        released_at: "2025-12-04"
        channel: stable
        evidence_source_ids:
          - doc-cuda-13
          - doc-cutile-python-dsl
        notes: |
          Introduced cuTile Python DSL (see sources/docs/cutile-python-dsl.md).
          Release date is the date of NVIDIA's CUDA 13.1 launch post.
      - name: "13.0"
        released_at: "2025-08-06"
        channel: stable
        evidence_source_ids:
          - doc-cuda-13
        notes: |
          Release date is the date of NVIDIA's CUDA 13.0 launch post. The
          former PyTorch PR 175826 evidence was removed because that PR was
          closed without merge and therefore does not establish a CI move.
      - name: "12.8"
        released_at: "2025-01-31"
        channel: stable
        evidence_source_ids:
          - doc-cuda-13
        notes: |
          First CUDA toolkit release with Blackwell support. Release date is
          the date of NVIDIA's CUDA 12.8 launch post. Closed, unmerged PyTorch
          PR 150705 is not used as evidence for downstream adoption.
