## Selected tool releases of record for the version-sensitive registry.
## Read by scripts/check_version_freshness.py and the validator's
## DEC-4 CUTLASS pinning rule (task5). Schema: data/schemas.yaml
## :: tool-versions-snapshot.
##
## This file is deterministic and offline. data/tool-release-receipt.yaml
## records the exact authoritative release-list receipt used to populate it;
## check_version_freshness.py requires the two files to agree. Validation does
## not claim to discover releases published after that dated receipt.
##
## "needs-verification" sentinels mark fields the current refresh
## round did not authoritatively pin; future refresh rounds should
## replace them. The validator (task5) does not reject
## needs-verification entries, but check_version_freshness.py
## flags them as advisory warnings.

tools:
  - tool: triton
    upstream_checked_at: "2026-08-18"
    releases:
      - name: "3.7.1"
        released_at: "2026-06-18"
        channel: stable
        release_notes_url: "https://github.com/triton-lang/triton/releases/tag/v3.7.1"
        evidence_source_ids:
          - doc-triton-3.6-blackwell
        notes: |
          Current stable release at the 2026-08-18 audit cutoff. GitHub's
          published_at timestamp is 2026-06-18T14:38:51Z. The Blackwell
          capability boundary remains anchored to the 3.6 introduction notes;
          3.7.1 was reviewed for continuity, not as a new provenance source.
      - name: "3.7.0"
        released_at: "2026-05-07"
        channel: stable
        release_notes_url: "https://github.com/triton-lang/triton/releases/tag/v3.7.0"
        evidence_source_ids:
          - doc-triton-3.6-blackwell
        notes: |
          GitHub's published_at timestamp is 2026-05-07T22:19:06Z. Retained as
          a release-of-record between the 3.6 introduction and current 3.7.1.
      - name: "3.6.0"
        released_at: "2026-01-21"
        channel: stable
        release_notes_url: "https://github.com/triton-lang/triton/releases/tag/v3.6.0"
        evidence_source_ids:
          - doc-triton-3.6-blackwell
          - pr-sglang-22079
          - pr-sglang-21019
        notes: |
          First Triton release with native Blackwell tcgen05 + TMEM lowering
          infrastructure. Strongest user-visible Blackwell paths: descriptor/TMA
          warp-specialized matmul, Gluon multi-CTA / 2CTA, tl.dot_scaled / block
          scaled. See data/triton-3.6-evidence.md for the per-pathway breakdown.
      - name: "3.5.1"
        released_at: "2025-11-12"
        channel: stable
        release_notes_url: "https://github.com/triton-lang/triton/releases/tag/v3.5.1"
        notes: |
          Last 3.5.x patch before the 3.6 Blackwell story. Pages with
          version_sensitive claims valid for ">=3.5,<3.6" should pin to this
          release.

